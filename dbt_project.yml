name: olist_dbt
version: "1.0.0"
profile: olist_dbt

models:
  olist_dbt:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    intermediate:
      +materialized: view
      +schema: intermediate

flags:
  send_anonymous_usage_stats: false

on-run-start:
  - "create schema if not exists workspace.olist_dbt_marts"
  - >
    create or replace function workspace.olist_dbt_marts.state_row_filter(customer_state string)
    returns boolean
    return is_member('admins') or customer_state = 'SP'