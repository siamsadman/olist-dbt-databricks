bundle:
  name: olist_dbt

variables:
  warehouse_id:
    description: SQL warehouse that runs the dbt SQL
    default: 1dfad0639e47a9bb

targets:
  dev:
    mode: development
    default: true

resources:
  jobs:
    olist_dbt_job:
      name: olist_dbt_build
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.8.0,<2.0.0
      tasks:
        - task_key: dbt_build
          environment_key: dbt_env
          dbt_task:
            project_directory: ${workspace.file_path}
            warehouse_id: ${var.warehouse_id}
            catalog: workspace
            schema: olist_dbt
            commands:
              - dbt build